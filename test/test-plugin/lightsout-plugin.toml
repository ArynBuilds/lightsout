# A plugin the tests use: a command with a key, one shown in a split, a link it opens,
# and a program that runs on an event.
id = "test-plugin"
name = "Test plugin"
version = "1.0.0"
min_lightsout = "0.3"

[[commands]]
id = "hello"
title = "Say hello"
run = ["sh", "./hello.sh"]

[[commands]]
id = "show"
title = "Show where you are"
place = "split"
run = ["sh", "./show.sh"]

[[keys]]
key = "ctrl+alt+h"
command = "test-plugin.hello"

[[links]]
pattern = "https://example.com/*"
command = "test-plugin.hello"

[[events]]
on = "room.opened"
run = ["sh", "./event.sh"]

[[parts]]
id = "status"
side = "bottom"
size = 1
run = ["sh", "./part.sh"]
