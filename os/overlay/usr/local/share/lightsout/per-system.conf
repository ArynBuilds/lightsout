# Lights Out uses your Windows user folder as its home folder, so every CLI's
# settings, logins and sessions are shared with Windows automatically.
# The folders below hold PROGRAMS built for one system (Windows .exe vs Linux),
# so Lights Out keeps its own Linux copy of each, inside the Lights Out system
# file. Windows' copies are never touched. One folder per line, relative to home.
.local
.cache
.cargo
.rustup
.nvm
.bun
.deno
.pyenv
.volta
go
