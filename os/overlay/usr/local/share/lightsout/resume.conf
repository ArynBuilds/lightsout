# How a CLI continues its session when Lights Out reopens it (after a restart or a
# switch between Windows and Lights Out). One line per program:   program = command
# A command with {id} continues that exact session; it is used when the agent's own
# session ID is known, the plain line otherwise.
# Programs not listed here get their original command typed back in (not run).
# Add your own in ~/.config/lightsout/resume.conf (same format, wins over this file).
claude   = claude --continue
claude   = claude --resume {id}
codex    = codex resume --last
opencode = opencode --continue
aider    = aider --restore-chat-history
