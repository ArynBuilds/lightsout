# How an agent continues its own conversation when Lights Out opens its tab again (after
# Quit, Lights Out or Lights On). Plain data: ~/.config/lightsout/resume.conf adds to this
# file (same lines; it wins).
#
#   PROGRAM = COMMAND          continues that exact conversation: {id} is its ID, {args} the
#                              options it was started with (written --flag or --flag=value)
#   PROGRAM record = FILE KEY  where the agent writes its conversation ID while it runs
#                              ({pid}: its process number): nothing needs setting up
#   PROGRAM hook = FILE        its hooks file: Lights Out adds `lightsout report-session`
#                              there, which tells the tab the conversation when one starts
#   PROGRAM skip = OPTIONS     its own conversation options, never given again
#
# Without the ID nothing is guessed (the latest conversation in a folder may be another
# tab's): the command is typed back in, unrun, as for any program not listed here. An agent
# with one history per folder can have a COMMAND without {id}.
claude        = claude {args} --resume {id}
claude record = ~/.claude/sessions/{pid}.json sessionId
claude skip   = --resume -r --continue -c --fork-session --print -p
codex         = codex {args} resume {id}
codex hook    = ~/.codex/hooks.json
codex skip    = --last
opencode      = opencode {args} --session {id}
opencode skip = --continue -c --session -s
aider         = aider --restore-chat-history
