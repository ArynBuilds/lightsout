name: build

on:
  push:
    paths-ignore: ["**.md"]
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  terminal-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and build
        run: cd term; cargo test --release; if ($LASTEXITCODE) { exit 1 }; cargo build --release
      - name: Test (tabs from a switch that didn't happen come back; a quiet view stays connected)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $B = "$PWD/term/target/release/lightsout.exe"
          # tabs saved for a switch to Lights Out that never happened (the PC came back to Windows)
          New-Item -ItemType Directory -Force C:\LightsOut\handoff | Out-Null
          '{"rooms":[{"name":"FromSwitch","active":0,"tabs":[{"focus":0,"layout":{"Leaf":0},"panes":[{"cwd":"C:/Windows"}]}]}],"room":0}' | Set-Content C:\LightsOut\handoff\tabs.json
          $env:LIGHTSOUT_SESSION = 'ciwin'
          Start-Process $B -ArgumentList '--session', 'ciwin', '--server' -WindowStyle Hidden
          $info = "$env:LOCALAPPDATA\lightsout\run\screen-ciwin.json"
          for ($i = 0; $i -lt 30 -and -not (Test-Path $info); $i++) { Start-Sleep 1 }
          $list = & $B list; $list
          if (-not ($list -match 'FromSwitch')) { throw 'the tabs saved at the switch did not come back' }
          if (Test-Path C:\LightsOut\handoff\tabs.json) { throw 'the tabs saved at the switch were not taken' }
          # a view that stays quiet (no keys) longer than the 5 s hello limit stays connected
          $j = Get-Content $info | ConvertFrom-Json
          $c = [Net.Sockets.TcpClient]::new('127.0.0.1', $j.port); $s = $c.GetStream(); $s.ReadTimeout = 2000
          $w = [IO.StreamWriter]::new($s); $w.AutoFlush = $true
          $w.WriteLine($j.token); $w.WriteLine('{"Resize":[100,30]}')
          $buf = [byte[]]::new(65536)
          try { while ($s.Read($buf, 0, $buf.Length) -gt 0) {} } catch {}   # the first screen
          Start-Sleep 8
          $w.WriteLine('{"Resize":[101,30]}')
          if ($s.Read($buf, 0, $buf.Length) -le 0) { throw 'the quiet view was dropped' }
          # a change (here a room added and named) is saved within seconds: a copy killed
          # right after, without a chance to save, still brings it back
          & $B room add Named | Out-Null
          Start-Sleep 5
          Get-Process lightsout | Stop-Process -Force
          $saved = Get-Content "$env:LOCALAPPDATA\lightsout\session-ciwin.json" -Raw
          if (-not ($saved -match '"name":"Named"')) { throw 'a room named just before a crash was lost' }
          # signing in without coming back from Lights Out: the app stays closed
          $p = Start-Process "$PWD/term/target/release/lightsout-app.exe" -ArgumentList '--if-returning' -PassThru
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'the app opened at sign-in without coming back from Lights Out' }
          # updates (cleanup.ps1 at Windows start), on stand-in folders for C:\LightsOut and the EFI partition
          $lo = "$env:RUNNER_TEMP\LightsOut"; $esp = "$env:RUNNER_TEMP\esp"
          $fresh = {
            Remove-Item $lo, $esp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$lo\update\previous\starter", "$lo\logs", "$esp\EFI\lightsout\results" | Out-Null
            'drive locked again' | Set-Content "$esp\EFI\lightsout\results\restart.log"
            'new' | Set-Content "$lo\system.img"; 'old' | Set-Content "$lo\update\previous\system.img"
            New-Item -ItemType Directory -Force "$lo\config" | Out-Null
            'new' | Set-Content "$lo\system-files.tar.gz"; 'old' | Set-Content "$lo\update\previous\system-files.tar.gz"
            'new' | Set-Content "$lo\config\system-base"; 'old' | Set-Content "$lo\update\previous\system-base"
            'new' | Set-Content "$esp\EFI\lightsout\starter.img"; 'old' | Set-Content "$lo\update\previous\starter\starter.img"
            'secret' | Set-Content "$esp\EFI\lightsout\handoff.key"
            New-Item -ItemType File "$lo\update\trial" | Out-Null
          }
          # the updated Lights Out was started (tried) but never came up: the previous version comes back
          & $fresh; New-Item -ItemType File "$lo\update\tried" | Out-Null
          & ./installer/cleanup.ps1 -LO $lo -Esp $esp
          if ((Get-Content "$lo\system.img") -ne 'old' -or (Get-Content "$esp\EFI\lightsout\starter.img") -ne 'old') { throw 'the previous version was not put back' }
          if ((Get-Content "$lo\system-files.tar.gz") -ne 'old' -or (Get-Content "$lo\config\system-base") -ne 'old') { throw 'the previous files and system name were not put back' }
          if ((Test-Path "$lo\update\trial") -or (Test-Path "$lo\update\previous")) { throw 'the update was not closed after putting the previous version back' }
          if (Test-Path "$esp\EFI\lightsout\handoff.key") { throw 'a leftover drive key stayed on the EFI partition' }
          if ((Get-Content "$lo\logs\boot\restart.log") -ne 'drive locked again') { throw 'the restart record was not copied where you can read it' }
          # updated but not started in Lights Out yet: nothing changes
          & $fresh
          & ./installer/cleanup.ps1 -LO $lo -Esp $esp
          if ((Get-Content "$lo\system.img") -ne 'new' -or -not (Test-Path "$lo\update\previous\system.img")) { throw 'an update not tried yet was undone' }
          'WINDOWS TEST PASSED'
      - uses: actions/upload-artifact@v4
        with:
          name: lightsout-term-windows
          path: |
            term/target/release/lightsout.exe
            term/target/release/lightsout-app.exe
            installer/uninstall.ps1
            installer/cleanup.ps1
          retention-days: 14

  terminal-linux:
    # older Ubuntu = older glibc, so the binary runs on most Linux PCs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          for f in installer/install.sh linux/*.sh linux/switch os/overlay/usr/local/sbin/lightsout-power os/overlay/usr/local/sbin/lightsout-cores; do sh -n "$f"; done
          shellcheck -S error installer/install.sh linux/*.sh linux/switch mac/switch mac/logout-later mac/guard mac/uninstall.sh
          sh test/lowest-refresh.sh
          sudo sh test/cores.sh
          sh test/mac-guard.sh
      - name: Build and package
        run: |
          (cd term && cargo test --release && cargo build --release)
          d=out/lightsout-linux-x64; mkdir -p $d/bin $d/lib $d/sbin $d/systemd
          cp term/target/release/lightsout term/target/release/lightsout-app $d/bin/
          cp linux/switch linux/kiosk.sh linux/uninstall.sh $d/lib/
          cp os/overlay/usr/local/sbin/lightsout-power os/overlay/usr/local/sbin/lightsout-cores $d/sbin/
          cp os/overlay/etc/systemd/system/lightsout-cores.service $d/systemd/
          cp linux/systemd/* $d/systemd/
          chmod +x $d/bin/* $d/lib/* $d/sbin/*
          tar -C out -czf out/lightsout-linux-x64.tar.gz lightsout-linux-x64
      - name: Test the terminal view (closing it leaves the agents running; again over SSH)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: |
          set -ex
          B=$PWD/term/target/release
          export LIGHTSOUT_SESSION=citerm
          # a terminal, as SSH gives one: `lightsout` starts its background copy and shows it
          script -qfec "stty cols 120 rows 40; $B/lightsout" /dev/null > view.log 2>&1 &
          VIEW=$!
          for i in $(seq 1 30); do $B/lightsout list >/dev/null 2>&1 && break; sleep 1; done
          $B/lightsout new -- sh -c 'sleep 3; echo survived | tee /tmp/lo-detach.txt; sleep 120'
          # the terminal goes away (closed window, dropped SSH)
          kill -HUP $VIEW || true; pkill -HUP -f "script -qfec stty" || true
          sleep 6
          test "$(cat /tmp/lo-detach.txt)" = survived
          pgrep -f -- "--session citerm --server"
          # come back: the same screen
          timeout 5 script -qfec "stty cols 120 rows 40; $B/lightsout" /dev/null > view2.log 2>&1 || true
          grep -a -q survived view2.log
          grep -a -q rooms view2.log
          # over SSH (to this same machine): Lights Out starts there and stays after SSH closes
          sudo apt-get install -y -qq openssh-server >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          sudo ln -sf $B/lightsout /usr/local/bin/lightsout
          timeout 10 script -qfec "stty cols 120 rows 40; $B/lightsout open localhost" /dev/null > remote.log 2>&1 || true
          grep -a -q rooms remote.log
          # a room on that machine (what a remote room in the sidebar opens): just that room, and it reports what runs
          timeout 10 script -qfec "stty cols 120 rows 40; $B/lightsout open localhost --room room-9" /dev/null > room.log 2>&1 || true
          grep -a -q "lightsout-room:" room.log
          sleep 2
          pgrep -f -- "--session default --server"
          pkill -f -- "--server" || true
          sudo rm -f /usr/local/bin/lightsout
          # the rooms opened here are saved (as for anyone); the next tests start without them
          rm -f ~/.local/state/lightsout/session-default.json
          # reopening: known agents (resume.conf) continue, each tab its own session when known;
          # any other command is typed back in, not run
          mkdir -p ~/.config/lightsout ~/.local/state/lightsout
          printf '%s\n' 'myagent = echo continued-plain' 'myagent = echo continued-{id}' > ~/.config/lightsout/resume.conf
          tab() { echo "{\"focus\":0,\"layout\":{\"Leaf\":0},\"panes\":[{\"cwd\":\"/tmp\",$1}]}"; }
          echo "{\"rooms\":[{\"name\":\"Reopen\",\"active\":0,\"tabs\":[$(tab '"command":"myagent","session":"chat-7"'),$(tab '"command":"myagent"'),$(tab '"command":"echo typed-back"')]}],\"room\":0}" \
            > ~/.local/state/lightsout/session-cireopen.json
          export LIGHTSOUT_SESSION=cireopen
          $B/lightsout --session cireopen --server &
          for i in $(seq 1 30); do $B/lightsout list > reopen.txt 2>/dev/null && break; sleep 1; done
          sleep 3; cat reopen.txt
          pane() { awk -v t="$1" 'NR>1 && $3==t {print $1}' reopen.txt; }
          $B/lightsout read "$(pane 1)" | grep -q continued-chat-7
          $B/lightsout read "$(pane 2)" | grep -q continued-plain
          if $B/lightsout read "$(pane 3)" | grep -qE '^typed-back\s*$'; then echo "an unknown command ran"; exit 1; fi
          $B/lightsout read "$(pane 3)" | grep -q "echo typed-back"
          $B/lightsout close "$(pane 3)"; sleep 1          # closing a pane: it is gone from the list
          ! $B/lightsout list | awk 'NR > 1 {print $1}' | grep -qx "$(pane 3)"
          pkill -f -- "--session cireopen --server" || true
          # Quit keeps each agent's own conversation: two Claudes in one folder each come back to
          # theirs, in the folder they work in (a stand-in Claude that, like the real one, records
          # its chat and folder while it runs and removes the record when it stops). The second
          # opens another conversation while it runs (as /resume does): that one comes back
          mkdir -p /tmp/fake-claude && install -m755 test/fake-claude /tmp/fake-claude/claude
          export LIGHTSOUT_SESSION=ciquit PATH=/tmp/fake-claude:$PATH
          $B/lightsout --session ciquit --server &
          for i in $(seq 1 30); do $B/lightsout list >/dev/null 2>&1 && break; sleep 1; done
          first=$($B/lightsout list | awk 'NR == 2 {print $1}')
          $B/lightsout send "$first" "cd /tmp && claude chat-A"
          $B/lightsout send "$($B/lightsout new --cwd /tmp)" "claude chat-B then chat-C"
          sleep 6
          $B/lightsout room add Named
          sleep 3
          $B/lightsout quit
          for i in $(seq 1 20); do pgrep -f -- "--session ciquit --server" >/dev/null || break; sleep 0.5; done
          $B/lightsout --session ciquit --server &
          for i in $(seq 1 30); do $B/lightsout list > quit.txt 2>/dev/null && break; sleep 1; done
          sleep 3; cat quit.txt; $B/lightsout room list
          $B/lightsout room list | grep -q Named
          for p in $(awk 'NR > 1 {print $1}' quit.txt); do $B/lightsout read "$p" --lines 5; done > quit-screens.txt
          cat quit-screens.txt
          grep -q "fake-claude --resume chat-A in /tmp" quit-screens.txt
          grep -q "fake-claude --resume chat-C" quit-screens.txt
          ! grep -q "fake-claude --resume chat-B" quit-screens.txt
          pkill -f -- "--session ciquit --server" || true
          echo "TERMINAL VIEW TEST PASSED"
      - name: Test on this Linux machine (install, Lights Out screen, power restore, uninstall)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: |
          set -ex
          LIGHTSOUT_BASE="file://$PWD/out" sh installer/install.sh
          test -x /usr/local/bin/lightsout-app
          test -f /etc/systemd/system/lightsout.target
          sudo test -f /etc/sudoers.d/lightsout
          sudo -l -U "$USER" | grep -q /usr/local/lib/lightsout/switch
          sudo systemd-analyze verify /etc/systemd/system/lightsout.target /etc/systemd/system/lightsout-kiosk.service /etc/systemd/system/lightsout-cores.service
          # the Lights Out screen with no monitor: headless sway + the app
          export XDG_RUNTIME_DIR=/tmp/xdg && mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sh /usr/local/lib/lightsout/kiosk.sh > kiosk.log 2>&1 &
          for i in $(seq 1 40); do lightsout list >/dev/null 2>&1 && break; sleep 1; done
          lightsout list | tee list.txt
          grep -q ROOM list.txt
          lightsout new -- sh -c 'echo hello-from-lights-out; sleep 30'
          sleep 4
          lightsout list | tee list2.txt
          test "$(grep -c Room list2.txt)" -ge 2
          # power settings: applied, then put back exactly
          snap() { cat /sys/bus/pci/devices/*/power/control /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null | md5sum; }
          before=$(snap)
          sudo /usr/local/sbin/lightsout-power
          sudo cat /run/lightsout/power.saved | head -5
          test -s /run/lightsout/cores.frugal && echo "frugal cores: $(cat /run/lightsout/cores.frugal)"
          sudo timeout 12 /usr/local/sbin/lightsout-cores || test $? = 124
          sudo /usr/local/sbin/lightsout-power --restore
          test "$before" = "$(snap)"
          pkill sway || true
          sudo sh /usr/local/lib/lightsout/uninstall.sh
          test ! -e /usr/local/bin/lightsout
          echo "LINUX TEST PASSED"
      - name: Logs
        if: failure()
        run: cat kiosk.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: lightsout-linux-x64
          path: out/lightsout-linux-x64.tar.gz
          retention-days: 14

  terminal-macos:
    # Mac machines are free for public repos; the private dev repo skips this job
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Apple chips + Intel) and package
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          (cd term && cargo build --release --target aarch64-apple-darwin && cargo build --release --target x86_64-apple-darwin)
          d=out/lightsout-macos; mkdir -p $d/bin $d/lib
          for b in lightsout lightsout-app; do
            lipo -create -output $d/bin/$b term/target/aarch64-apple-darwin/release/$b term/target/x86_64-apple-darwin/release/$b
          done
          cp mac/switch mac/logout-later mac/guard mac/uninstall.sh $d/lib/
          chmod +x $d/bin/* $d/lib/*
          tar -C out -czf out/lightsout-macos.tar.gz lightsout-macos
      - name: Test on this Mac (install, app, Lights Out on/off, uninstall)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: |
          set -ex
          sh -n mac/switch
          LIGHTSOUT_MAC_LOGOUT=1 LIGHTSOUT_BASE="file://$PWD/out" sh installer/install.sh
          test -x "/Applications/Lights Out.app/Contents/MacOS/lightsout"
          sudo -l | grep -q /usr/local/lib/lightsout/switch
          lightsout-app > app.log 2>&1 &
          for i in $(seq 1 40); do lightsout list >/dev/null 2>&1 && break; sleep 1; done
          lightsout list | tee list.txt
          grep -q ROOM list.txt
          lightsout new -- sh -c 'echo hello-mac; sleep 30'
          sleep 4
          lightsout list
          pmset -g | grep -i sleepdisabled
          app=$(pgrep -n lightsout-app)
          sudo -n /usr/local/lib/lightsout/switch out "$app" stay
          S="/Library/Application Support/LightsOut"
          test -f "$S/active"
          pmset -g | grep -iE "sleepdisabled|lowpowermode"
          echo "background processes slowed: $(wc -l < "$S/throttled")"; test "$(wc -l < "$S/throttled")" -gt 0
          ! grep -qx "$app" "$S/throttled"   # Lights Out itself is never slowed
          lightsout list                       # and still answers
          sudo -n /usr/local/lib/lightsout/switch in
          test ! -f "$S/active"
          test ! -f "$S/throttled"
          echo "MAC TEST PASSED"
      - name: Log-out mode (agents in the background service, sign-in return)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: |
          set -ex
          S="/Library/Application Support/LightsOut"
          # --- logged-out mode: agents in the background service (the log-out
          # itself can't run here: it would log out this test machine)
          test -f /Library/LaunchDaemons/sh.lightsout.agents.plist
          lightsout-app --session x --if-returning; ! pgrep -f "session x"   # normal sign-in: stays closed
          pkill lightsout-app || true; sleep 2
          sudo -n /usr/local/lib/lightsout/switch out 0 stay
          plutil -lint /Library/LaunchDaemons/sh.lightsout.agents.plist
          sudo launchctl print system/sh.lightsout.agents | head -20
          sudo launchctl kickstart -k system/sh.lightsout.agents
          for i in $(seq 1 30); do lightsout list >/dev/null 2>&1 && break; sleep 1; done
          lightsout list
          ps -o user=,command= -p "$(pgrep -f 'lightsout-app --headless')"
          id=$(lightsout new -- sh -c 'echo hello-service; sleep 300')
          for i in $(seq 1 30); do lightsout read "$id" | grep -q hello-service && break; sleep 1; done
          lightsout read "$id" --lines 20
          lightsout read "$id" | grep hello-service
          # signing back in: the app takes the tabs back, the Mac's settings return
          lightsout-app > app2.log 2>&1 &
          for i in $(seq 1 30); do pgrep -f 'lightsout-app --headless' >/dev/null || break; sleep 1; done
          ! pgrep -f 'lightsout-app --headless'
          for i in $(seq 1 30); do lightsout list >/dev/null 2>&1 && break; sleep 1; done
          lightsout list | tee back.txt
          test "$(grep -c Room back.txt)" -ge 2
          test ! -f "$S/active"
          pkill lightsout-app || true
          echo "MAC LOG-OUT MODE PASSED"
      - name: Crash safety (the app is killed in Lights Out; the safety net puts the Mac back)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: |
          set -ex
          sh test/mac-guard.sh
          S="/Library/Application Support/LightsOut"
          plutil -lint /Library/LaunchDaemons/sh.lightsout.guard.plist
          sudo launchctl print system/sh.lightsout.guard | head -20
          sleep_before=$(pmset -g | awk '$1 == "SleepDisabled" {print $2}')
          lightsout-app > crash.log 2>&1 &
          for i in $(seq 1 40); do lightsout list >/dev/null 2>&1 && break; sleep 1; done
          sudo -n /usr/local/lib/lightsout/switch out "$(pgrep -n lightsout-app)" stay
          sudo -n /usr/local/lib/lightsout/switch awake
          test -f "$S/active"
          pkill -9 lightsout-app                   # a crash: no Lights On, nothing cleaned up
          for i in $(seq 1 50); do [ -f "$S/active" ] || [ -f "$S/awake" ] || break; sleep 1; done
          test ! -f "$S/active"; test ! -f "$S/awake"; test ! -f "$S/throttled"
          test "$(pmset -g | awk '$1 == "SleepDisabled" {print $2}')" = "$sleep_before"
          echo "MAC CRASH SAFETY PASSED"
      - name: Mac log-out mode details
        if: failure()
        run: |
          cat /tmp/lightsout-agents.log 2>/dev/null | tail -40 || true
          lightsout read 1 --lines 30 2>&1 || true
          for p in $(pgrep -f 'lightsout-app --headless'); do ps -o pid,user,command -g "$(ps -o pgid= -p $p)" || true; pgrep -lP "$p" || true; done
      - name: Uninstall (Mac)
        if: ${{ always() && !contains(github.ref, '-rc') }}
        run: |
          set -ex
          pkill lightsout-app || true
          sudo sh /usr/local/lib/lightsout/uninstall.sh
          test ! -e /usr/local/bin/lightsout
      - name: Logs
        if: failure()
        run: cat app.log app2.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: lightsout-macos
          path: out/lightsout-macos.tar.gz
          retention-days: 14

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
      volumes:
        - /mnt:/mnt   # the runner's big second drive (~70 GB) for the VM test
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            mmdebstrap e2fsprogs zstd pigz cpio build-essential pkg-config curl kmod busybox-static util-linux \
            rpm cryptsetup-bin tpm2-tools libtss2-tcti-device0t64 \
            qemu-system-x86 ovmf swtpm swtpm-tools ntfs-3g dosfstools mtools gdisk procps ca-certificates
      - name: Build the terminal (Linux)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          cd term && cargo build --release
          mkdir -p ../term-bin && cp target/release/lightsout target/release/lightsout-app ../term-bin/
      - name: Build system image
        run: bash os/build.sh
      - name: Build starter
        run: |
          bash starter/build.sh
          v=$(cat os/out/boot/kernel-version)   # the starter is built from the same system
          # Linux 7.1+: older NTFS drivers can't open a long-used Windows C: (quiet "No such file")
          test "$(printf '%s\n' 7.1 "${v%%-*}" | sort -V | head -n 1)" = 7.1
      - name: Upload starter
        uses: actions/upload-artifact@v4
        with:
          name: lightsout-starter
          path: starter/out/
          retention-days: 14
      - name: Upload system image
        uses: actions/upload-artifact@v4
        with:
          name: lightsout-system
          path: |
            os/out/system.img.gz
            os/out/system.img.gz.sha256
            os/out/system-base
            os/out/system-files.tar.gz
          retention-days: 14
          compression-level: 0
      - name: Free disk space
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: rm -rf os/rootfs starter/root term/target ~/.cargo/registry && df -h / /mnt | tail -n 2
      - name: Test in a virtual PC (UEFI + TPM + NTFS C:)
        if: ${{ !contains(github.ref, '-rc') }}  # test builds (vX-rc.N) skip the tests: you test them yourself
        run: VMTEST_DIR=/mnt/vmtest bash test/vm-test.sh
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-logs
          path: |
            /mnt/vmtest/serial*.log
            test/selftest-report.txt
          retention-days: 7

  release:
    # tag vX.Y.Z -> GitHub Release with everything the one-line installers download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [terminal-windows, terminal-linux, terminal-macos, build-and-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: a
      - name: Package
        run: |
          mkdir rel
          (cd a/lightsout-term-windows && zip -j ../../rel/lightsout-windows-x64.zip $(find . -type f))
          (cd a/lightsout-starter && zip -r ../../rel/lightsout-starter.zip EFI)
          cp a/lightsout-system/system.img.gz a/lightsout-system/system.img.gz.sha256 a/lightsout-system/system-base a/lightsout-system/system-files.tar.gz rel/
          cp a/lightsout-linux-x64/lightsout-linux-x64.tar.gz a/lightsout-macos/lightsout-macos.tar.gz rel/
          ls -la rel
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rel/* -R "$GITHUB_REPOSITORY" --title "Lights Out $GITHUB_REF_NAME" --generate-notes $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac)
