name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash target/release/lightsout.exe -Algorithm SHA256).Hash.ToLower()
          "$h  lightsout.exe" | Out-File -Encoding ascii target/release/lightsout.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lightsout
          path: |
            target/release/lightsout.exe
            target/release/lightsout.exe.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/lightsout.exe
            target/release/lightsout.exe.sha256
