[package]
name = "lightsout"
version = "0.1.1"
edition = "2021"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Console", "Devices_Radios", "Foundation_Collections"] }
wmi = "0.18.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
